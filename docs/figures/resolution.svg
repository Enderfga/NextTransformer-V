<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" role="img" aria-label="Zero-shot resolution transfer (SigLIP2 tokens, harder probe)"><style>text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#e6e8f0;stroke-width:1}.tick,.row,.end,.key{fill:#4b5263;font-size:12px}.title{fill:#1d2433;font-size:16px;font-weight:700}.sub{fill:#5b6272;font-size:12.5px}.link{stroke:#7a7975;stroke-width:2;stroke-linecap:round}.dot{stroke:#fcfcfb;stroke-width:2}.s1,.c1{fill:#2a78d6}.s2,.c2{fill:#eb6834}.c3{fill:#1baf7a}.c4{fill:#eda100}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}path.c1{stroke:#2a78d6}path.c2{stroke:#eb6834}path.c3{stroke:#1baf7a}path.c4{stroke:#eda100}</style><rect x="1" y="1" width="778" height="304" rx="16" fill="#fbfbfe" stroke="#e2e6f4" stroke-width="1.5"/><g transform="translate(10,10)"><text class="title" x="12" y="24">Zero-shot resolution transfer (SigLIP2 tokens, harder probe)</text><text class="sub" x="12" y="42">Trained at 12 x 12 tokens per image (384 px). The same images at 576 and 768 px give 18 x 18 and</text><text class="sub" x="12" y="60">24 x 24 tokens, so vertical neighbours sit 18 or 24 tokens apart instead of 12. acc2; chance is 50%.</text><circle class="dot c1" cx="17" cy="78" r="5"/><text class="key" x="27" y="82">Dense · RoPE-1D</text><circle class="dot c2" cx="152" cy="78" r="5"/><text class="key" x="162" y="82">Hybrid · RoPE-1D</text><circle class="dot c3" cx="294" cy="78" r="5"/><text class="key" x="304" y="82">Hybrid · NoPE</text><circle class="dot c4" cx="415" cy="78" r="5"/><text class="key" x="425" y="82">Hybrid · NoPE + 2D conv</text><g transform="translate(0.0,96) scale(0.7555)"><text class="row" x="46" y="12" font-weight="600">vertical relations</text><line class="grid" x1="46" x2="376" y1="200.0" y2="200.0"/><text class="tick" x="40" y="204.0" text-anchor="end">50%</text><line class="grid" x1="46" x2="376" y1="166.0" y2="166.0"/><text class="tick" x="40" y="17