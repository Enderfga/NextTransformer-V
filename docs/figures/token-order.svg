<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="Where the backbone reads 2D position from (SigLIP2 tokens)"><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#e6e5e1;stroke-width:1}.tick,.row,.end,.key{fill:#52514e;font-size:12px}.title{fill:#0b0b0b;font-size:14px;font-weight:600}.sub{fill:#52514e;font-size:12px}.link{stroke:#7a7975;stroke-width:2;stroke-linecap:round}.dot{stroke:#fcfcfb;stroke-width:2}.s1,.c1{fill:#2a78d6}.s2,.c2{fill:#eb6834}.c3{fill:#1baf7a}.c4{fill:#eda100}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}path.c1{stroke:#2a78d6}path.c2{stroke:#eb6834}path.c3{stroke:#1baf7a}path.c4{stroke:#eda100}</style><rect width="100%" height="100%" fill="#fcfcfb"/><text class="title" x="12" y="20">Where the backbone reads 2D position from (SigLIP2 tokens)</text><text class="sub" x="12" y="38">Harder probe, final checkpoint. The image tokens are reordered; their content is unchanged.</text><text class="sub" x="12" y="56">Near 0%: position read from token order. Near 100%: read from token content.</text><circle class="dot s1" cx="17" cy="74" r="5"/><text class="key" x="27" y="78">horizontal, columns of each token row reversed</text><circle class="dot s2" cx="369" cy="74" r="5"/><text class="key" x="379" y="78">vertical, token rows reversed</text><g transform="translate(0,92) scale(0.9744)"><line class="grid" x1="270.0" x2="270.0" y1="18" y2="212"/><text class="tick" x="270.0" y="230" text-anchor="middle">0%</text><line class="grid" x1="366.0" x2="366.0" y1="18" y2="212"/><text class="tick" x="366.0" y="230" text-anchor="middle">20%</text><line class="grid" x1="462.0" x2="462.0" y1="18" y2="212"/><text class="tick" x="462.0" y="230" text-anchor="middle">40%</text><line class="grid" x1="558.0" x2="558.0" y1="18" y2="212"/><text class="tick" x="558.0" y="230" text-anchor="middle">60%</text><line class="grid" x1="654.0" x2="654.0" y1="18" y2="212"/><text class="tick" x="654.0" y="230" text-anchor="middle">80%</text><line class="grid" x1="750.0" x2="750.0" y1="18" y2="212"/><text class="tick" x="750.0" y="230" text-anchor="middle">100%</text><text class="row" x="258" y="40" text-anchor="end">Dense · RoPE-1D</text><line class="link" x1="423.4" x2="656.3" y1="36" y2="36"/><circle class="dot s1" cx="656.3" cy="36" r="5"/><circle class="dot s2" cx="423.4" cy="36" r="5"/><text class="row" x="258" y="70" text-anchor="end">Dense · NoPE</text><line class="link" x1="518.3" x2="663.6" y1="66" y2="66"/><circle class="dot s1" cx="663.6" cy="66" r="5"/><circle class="dot s2" cx="518.3" cy="66" r="5"/><text class="row" x="258" y="100" text-anchor="end">Hybrid · RoPE-1D</text><line class="link" x1="403.0" x2="549.6" y1="96" y2="96"/><circle class="dot s1" cx="403.0" cy="96" r="5"/><circle class="dot s2" cx="549.6" cy="96" r="5"/><text class="row" x="258" y="130" text-anchor="end">Hybrid · NoPE</text><line class="link" x1="361.2" x2="691.1" y1="126" y2="126"/><circle class="dot s1" cx="361.2" cy="126" r="5"/><circle class="dot s2" cx="691.1" cy="126" r="5"/><text class="row" x="258" y="160" text-anchor="end">Hybrid · RoPE-2D</text><line class="link" x1="447.1" x2="563.9" y1="156" y2="156"/><circle class="dot s1" cx="447.1" cy="156" r="5"/><circle class="dot s2" cx="563.9" cy="156" r="5"/><text class="row" x="258" y="190" text-anchor="end">Hybrid · NoPE + 2D conv</text><line class="link" x1="363.7" x2="407.2" y1="186" y2="186"/><circle class="dot s1" cx="363.7" cy="186" r="5"/><circle class="dot s2" cx="407.2" cy="186" r="5"/></g></svg>
