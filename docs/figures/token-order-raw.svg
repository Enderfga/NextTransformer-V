<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 233" role="img" aria-label="Where the backbone reads 2D position from (raw pixel patches)"><style>text{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.grid{stroke:#e6e8f0;stroke-width:1}.tick,.row,.end,.key{fill:#4b5263;font-size:12px}.title{fill:#1d2433;font-size:16px;font-weight:700}.sub{fill:#5b6272;font-size:12.5px}.link{stroke:#7a7975;stroke-width:2;stroke-linecap:round}.dot{stroke:#fcfcfb;stroke-width:2}.s1,.c1{fill:#2a78d6}.s2,.c2{fill:#eb6834}.c3{fill:#1baf7a}.c4{fill:#eda100}.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}path.c1{stroke:#2a78d6}path.c2{stroke:#eb6834}path.c3{stroke:#1baf7a}path.c4{stroke:#eda100}</style><rect x="1" y="1" width="778" height="231" rx="16" fill="#fbfbfe" stroke="#e2e6f4" stroke-width="1.5"/><g transform="translate(10,10)"><text class="title" x="12" y="24">Where the backbone reads 2D position from (raw pixel patches)</text><text class="sub" x="12" y="42">Harder probe, final checkpoint; raw patches carry no position embedding.</text><circle class="dot s1" cx="17" cy="60" r="5"/><text class="key" x="27" y="64">horizontal, columns of each token row reversed</text><circle class="dot s2" cx="369" cy="60" r="5"/><text class="key" x="379" y="64">vertical, token rows reversed</text><g transform="translate(0.0,78) scale(0.9744)"><line class="grid" x1="270.0" x2="270.0" y1="18" y2="92"/><text class="tick" x="270.0" y="110" text-anchor="middle">0%</text><line class="grid" x1="366.0" x2="366.0" y1="18" y2="92"/><text class="tick" x="366.0" y="110" text-anchor="middle">20%</text><line class="grid" x1="462.0" x2="462.0" y1="18" y2="92"/><text class="tick" x="462.0" y="110" text-anchor="middle">40%</text><line class="grid" x1="558.0" x2="558.0" y1="18" y2="92"/><text class="tick" x="558.0" y="110" text-anchor="middle">60%</text><line class="grid" x1="654.0" x2="654.0" y1="18" y2="92"/><text class="tick" x="654.0" y="110" text-anchor="middle">80%</text><line class="grid" x1="750.0" x2="750.0" y1="18" y2="92"/><text class="tick" x="750.0" y="110" text-anchor="middle">100%</text><text class="row" x="258" y="40" text-anchor="end">Hybrid · NoPE, raw patches</text><line class="link" x1="373.5" x2="499.6" y1="36" y2="36"/><circle class="dot s1" cx="499.6" cy="36" r="5"/><circle class="dot s2" cx="373.5" cy="36" r="5"/><text class="row" x="258" y="70" text-anchor="end">Hybrid · NoPE + 2D conv, raw patches</text><line class="link" x1="391.1" x2="403.5" y1="66" y2="66"/><circle class="dot s1" cx="403.5" cy="66" r="5"/><circle class="dot s2" cx="391.1" cy="66" r="5"/></g></g></svg>
